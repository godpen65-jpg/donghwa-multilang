<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다국어 동화 모음</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #fdf6ec;
    color: #4a3f35;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.sub {
    text-align: center;
    color: #8a7c6d;
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 10px;
    text-align: center;
  }
  .langs {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .lang-box {
    flex: 1;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    background-color: #eee;
  }
  .lang-box .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.72rem;
    text-align: center;
    padding: 3px 0;
  }
  .lang-box:disabled {
    cursor: default;
    opacity: 0.35;
  }
  .lang-box:not(:disabled):active {
    transform: scale(0.96);
  }
</style>
</head>
<body>
  <h1>📖 다국어 동화 모음</h1>
  <p class="sub">이야기를 고르고, 언어를 눌러보세요 (유튜브로 재생돼요)</p>

  <div class="grid" id="grid"></div>

<script>
const STORIES = [{"title":"내 걱정은 하지마","한국어":"mYNs9H2zPWI","영어":null,"중국어":"W2CLTfqz0Z4"},{"title":"가방에 뭐 있어?","한국어":"t50uU4NKR6E","영어":"zstpfcWy3eE","중국어":"F55m4wg_eNA"},{"title":"해치","한국어":"dJfqbAwTFcs","영어":"gbL5THv9Yes","중국어":"wzHSPbq93P0"},{"title":"인삼 오형제","한국어":"dYVMY7uqcZw","영어":"WWQwQWwOPuA","중국어":"7ng6pSgy9GI"},{"title":"파랗고 빨갛고 투명한 나","한국어":"l4Gou0qk9tw","영어":null,"중국어":"YPk5NF84Hck"},{"title":"달달달 달려요","한국어":"gMyxOhx8pIM","영어":"wR7LmmZC2e8","중국어":null},{"title":"걱정상자","한국어":"ASmEfIOck2g","영어":"jO8s-5oIExk","중국어":"fhbs5ZSDFUM"},{"title":"달팽이 달리기","한국어":"qVfYhnytDp0","영어":"Je9K6du_Io8","중국어":"_Jx1-oRAD_8"},{"title":"내가 예쁘다고?","한국어":"D1NovxfNpUQ","영어":"md-H0towX5s","중국어":"iYgsMuq_3yU"},{"title":"호랑감투","한국어":"hN76P21_Urc","영어":"EZE7yVeGLZk","중국어":"VF6YTGObXqw"},{"title":"문 밖에 사자가 있다","한국어":"G7n4n8IWSaM","영어":"45yN-s_IOWQ","중국어":"Pmq4DtOM8rs"},{"title":"표정연습","한국어":"t6DMjoccq7Y","영어":"FYI2pR3EtJI","중국어":"iIt99ZwcHww"},{"title":"노란길을 지켜줘","한국어":"25jgkA7Iqgc","영어":"3Haf0giPxmI","중국어":"J8igro_ksoE"},{"title":"마음버스","한국어":"uPjHqcKZSe8","영어":"g5kCYOZTjOg","중국어":"w9KPoEIz6no"},{"title":"암탉과 누렁이","한국어":"XquaNkxqiF0","영어":"h5VtBZd4NzA","중국어":"lgCdiOoADVI"},{"title":"연이네 설맞이","한국어":"XVldrQ7EiDk","영어":"vZ4UXEketW8","중국어":"3u7bmK4MI8c"},{"title":"숲속 사진관에 온 편지","한국어":"eNrEQphgepA","영어":"5zACR6YKXRk","중국어":"H2foz58Q1Os"},{"title":"봉봉이의 아주 특별한 모자","한국어":"8TDmOBQWP7M","영어":"oN2muTzVYmI","중국어":"-16AIQ_OFJk"},{"title":"어느 여름날","한국어":"gvl8BVXmik8","영어":"qoQY0qOk8SU","중국어":"YD3y3pEDDuY"},{"title":"책","한국어":"sYfHjF8DGQA","영어":"m3Ym06j-V18","중국어":"1vrUUyo5yEc"},{"title":"마음이 그랬어","한국어":"VXBxPKgEOZk","영어":"xtM6AoJGypY","중국어":"xSho2ZzUh_4"},{"title":"기울어","한국어":"pBV4h13hBSw","영어":"zIeAnB1kWBA","중국어":"e00DuLnJ27U"},{"title":"무서운 날의 그림책","한국어":"zj_5XZCmg_Y","영어":"12S2dnwf_Bg","중국어":"wHWltaM_n9Y"},{"title":"원숭이 오누이","한국어":"FAk2xhvkhQI","영어":"r7-G-LFFfLo","중국어":"ATRhON481Fg"},{"title":"다섯 번 울어야 말하는 고양이 카노","한국어":"LfvuUqRjvxg","영어":"zuUzgxo6v4E","중국어":"yCopGjUkosg"},{"title":"오늘도 맑음","한국어":"WclmITcKra4","영어":"xpNaqtEmJlE","중국어":"oLVmzoRFn6Q"},{"title":"딩동거미","한국어":"MgynJh0SMZE","영어":"HpcwceEQZFg","중국어":"G3hZyS3F0uc"}];

const LANGS = ["한국어", "영어", "중국어"];

const grid = document.getElementById('grid');
STORIES.forEach(story => {
  const card = document.createElement('div');
  card.className = 'card';

  const h2 = document.createElement('h2');
  h2.textContent = story.title;
  card.appendChild(h2);

  const langsDiv = document.createElement('div');
  langsDiv.className = 'langs';

  LANGS.forEach(lang => {
    const vid = story[lang];
    const btn = document.createElement('button');
    btn.className = 'lang-box';
    if (vid) {
      btn.style.backgroundImage = `url(https://i.ytimg.com/vi/${vid}/hqdefault.jpg)`;
      btn.addEventListener('click', () => playVideo(vid));
    } else {
      btn.disabled = true;
    }
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = vid ? lang : `${lang} 없음`;
    btn.appendChild(label);
    langsDiv.appendChild(btn);
  });

  card.appendChild(langsDiv);
  grid.appendChild(card);
});

function playVideo(vid) {
  window.open(`https://www.youtube.com/watch?v=${vid}`, '_blank');
}
</script>
</body>
</html>
