<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>품사 놀이터 문제지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  @page{size:A4;margin:12mm;}
  :root{
    --ink:#3a3128; --muted:#9a8d78; --line:#d9cdb3;
    --n:#3a7bd5; --n-bg:#e6effc; --v:#e0533f; --v-bg:#fde8e4;
    --a:#d98a00; --a-bg:#fdf1d6; --d:#2e9e5b; --d-bg:#e0f4e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#e9e4f5;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
       -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .tools{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#9b8fd6;}
  .tools a,.tools button{border:none;border-radius:12px;padding:10px 16px;font:inherit;font-size:17px;cursor:pointer;background:#fff;color:#5a4ea0;text-decoration:none;}
  .tools label{color:#fff;font-size:16px;display:flex;align-items:center;gap:6px;}
  .page{width:186mm;min-height:273mm;margin:10px auto;background:#fff;padding:0;position:relative;}
  @media screen{ .page{padding:8mm;width:202mm;min-height:289mm;box-shadow:0 4px 14px rgba(0,0,0,.15);} }
  .page+.page{break-before:page;}
  @media print{ body{background:#fff;} .tools{display:none;} .page{margin:0;} }

  .head{display:flex;align-items:flex-end;gap:10px;border-bottom:3px solid #9b8fd6;padding-bottom:6px;margin-bottom:10px;}
  .head h1{margin:0;font-weight:400;font-size:24px;color:#5a4ea0;flex:1;}
  .head h1 small{font-size:14px;color:var(--muted);}
  .head .fill{font-size:16px;white-space:nowrap;}
  .head .fill span{display:inline-block;width:32mm;border-bottom:2px solid var(--ink);margin:0 6px 0 4px;}

  h2{font-weight:400;font-size:22px;margin:4px 0 2px;}
  h2 .no{display:inline-block;background:#5a4ea0;color:#fff;border-radius:99px;width:30px;height:30px;text-align:center;line-height:30px;margin-right:6px;font-size:18px;}
  .how{font-size:16px;color:#6b5f4d;margin:0 0 10px;}
  .how .en{color:var(--muted);}

  .legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px;}
  .lg{border-radius:12px;padding:6px 4px;text-align:center;}
  .lg .em{font-size:24px;display:block;line-height:1.2;}
  .lg b{display:block;font-weight:400;font-size:18px;}
  .lg i{display:block;font-style:normal;font-size:13px;color:#6b5f4d;}
  .c-n{background:var(--n-bg);} .c-v{background:var(--v-bg);} .c-a{background:var(--a-bg);} .c-d{background:var(--d-bg);}
  .t-n{color:var(--n);} .t-v{color:var(--v);} .t-a{color:var(--a);} .t-d{color:var(--d);}
  .secret{border:2px dashed var(--v);border-radius:12px;padding:6px 12px;font-size:16px;margin:0 0 10px;}

  /* 1. 같이 하자 */
  .lets{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .li{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;}
  .li .k{font-size:15px;color:var(--muted);width:20px;}
  .li .em{font-size:28px;}
  .li .tx{flex:1;}
  .li .tx b{display:block;font-weight:400;font-size:21px;}
  .li .tx i{display:block;font-style:normal;font-size:17px;color:#5a4ea0;}
  .li .ox{font-size:26px;letter-spacing:6px;white-space:nowrap;}

  /* 2. 바구니 */
  .sort{width:100%;border-collapse:separate;border-spacing:0 6px;}
  .sort td{padding:6px 4px;font-size:18px;text-align:center;border-top:2px solid var(--line);border-bottom:2px solid var(--line);}
  .sort td:first-child{border-left:2px solid var(--line);border-radius:12px 0 0 12px;}
  .sort td:last-child{border-right:2px solid var(--line);border-radius:0 12px 12px 0;}
  .sort .k{color:var(--muted);font-size:14px;width:22px;}
  .sort .w{text-align:left;white-space:nowrap;}
  .sort .w span{font-size:26px;vertical-align:middle;margin-right:6px;}
  .sort .w b{font-weight:400;font-size:22px;}
  .sort .w i{font-style:normal;color:#5a4ea0;margin-left:6px;}
  .sort .ch{font-size:15px;white-space:nowrap;}

  /* 3·4. 문장 */
  .sb{border:2px solid var(--line);border-radius:14px;padding:8px 12px 10px;margin-bottom:9px;break-inside:avoid;}
  .sb .q{font-size:17px;margin-bottom:6px;}
  .sb .q .k{color:var(--muted);margin-right:4px;}
  .sb .q .pill{border-radius:99px;padding:1px 10px;}
  .line{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:4px 0;}
  .line .flag{font-size:16px;width:28px;padding-top:6px;}
  .w2{display:flex;flex-direction:column;align-items:center;font-size:25px;padding:0 4px;}
  .w2 .tail{color:var(--muted);font-size:20px;}
  .w2.x{color:#a9a090;}
  .w2 .box{width:100%;min-width:34px;height:12mm;border:2px solid #bdb19a;border-radius:6px;margin-top:3px;}
  .w2.x .box{border-style:dotted;border-color:#ddd;background:repeating-linear-gradient(45deg,#f5f2ea 0 4px,#fff 4px 8px);}

  /* 정답 */
  .ans{columns:2;column-gap:10mm;font-size:15px;line-height:1.6;}
  .ans h3{font-weight:400;font-size:17px;margin:8px 0 2px;color:#5a4ea0;break-after:avoid;}
  .ans div{break-inside:avoid;}
  .foot{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);}
  @media screen{ .foot{bottom:6mm;} }
</style>
</head>
<body>
<div class="tools">
  <button onclick="window.print()">🖨️ 인쇄 · PDF로 저장</button>
  <button id="new">🔄 새 문제로 바꾸기</button>
  <label><input type="checkbox" id="with-ans" checked> 정답지 같이 뽑기</label>
  <a href="parts-of-speech.html">◀ 품사 놀이터</a>
</div>
<div id="pages"></div>

<script src="pos-data.js"></script>
<script>
// 같은 번호면 같은 문제가 나오도록 시드 있는 난수
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rand=Math.random;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function letsKo(w){ return '같이 '+(w[3] ? w[1].slice(0,-1) : w[1])+'자!'; }
function letsEn(w){ return "Let's "+w[2]+'!'; }
const CIRCLE='①②③④⑤⑥⑦⑧⑨⑩⑪⑫';
const TARGETS=['v','n','v','a','v','d'];   // 앱과 같이 움직임 말을 더 자주

function head(no, title){
  return '<div class="head"><h1>🧺 품사 놀이터 <small>'+title+' · 문제지 '+no+'번</small></h1>'+
         '<div class="fill">이름<span></span> 날짜<span style="width:24mm"></span></div></div>';
}
function legend(){
  return '<div class="legend">'+ORDER.map(function(p){
    const x=P[p];
    return '<div class="lg c-'+p+'"><span class="em">'+x.em+'</span><b class="t-'+p+'">'+x.kid+'</b><i>'+x.ko+' · '+x.en+'<br>'+x.q+'</i></div>';
  }).join('')+'</div>';
}
function wordCells(toks, withBox){
  return toks.map(function(t,i){
    return '<span class="w2'+(t.p==='x'?' x':'')+'"><span>'+esc(t.w)+(t.tail?'<span class="tail">'+esc(t.tail)+'</span>':'')+(i===toks.length-1?'.':'')+'</span>'+
           (withBox?'<span class="box"></span>':'')+'</span>';
  }).join('');
}

function build(seed){
  rand=rng(seed);
  // 문제 고르기
  const lets=shuffle(shuffle(WORDS.v).slice(0,5).map(function(w){return {p:'v',w:w};})
    .concat(shuffle(WORDS.n.map(function(w){return {p:'n',w:w};}).concat(WORDS.a.map(function(w){return {p:'a',w:w};}))).slice(0,5)));
  let sort=[];
  ORDER.forEach(function(p){ shuffle(WORDS[p]).slice(0,3).forEach(function(w){ sort.push({p:p,w:w}); }); });
  sort=shuffle(sort);
  const pool=shuffle(SENTS), find=[];
  TARGETS.forEach(function(tg){
    const i=pool.findIndex(function(s){ return parse(s.ko).some(function(t){return t.p===tg;}) && parse(s.en).some(function(t){return t.p===tg;}); });
    find.push({tg:tg, s:pool.splice(i,1)[0]});
  });
  // 색칠은 네 가족이 많이 들어간 문장으로
  const color=pool.sort(function(a,b){ return new Set(parse(b.ko).map(function(t){return t.p;})).size - new Set(parse(a.ko).map(function(t){return t.p;})).size; }).slice(0,3);

  let h='';
  // 1쪽: 같이 하자
  h+='<section class="page">'+head(seed,'움직임 말 찾기')+legend()+
     '<h2><span class="no">1</span>같이 하자! · Let\'s!</h2>'+
     '<div class="secret">🔑 <b class="t-v">비법</b> — "같이 ○○자!"가 말이 되면 <b class="t-v">움직임 말(동사)</b>이에요. &nbsp;⭕ 같이 달리자! Let\'s run! &nbsp;❌ 같이 크자? Let\'s big?</div>'+
     '<p class="how">소리 내어 읽어 보고, 말이 되면 ⭕, 이상하면 ❌에 동그라미 하세요.</p>'+
     '<div class="lets">'+lets.map(function(q,i){
       return '<div class="li"><span class="k">'+CIRCLE[i]+'</span><span class="em">'+q.w[0]+'</span><span class="tx"><b>'+esc(letsKo(q.w))+'</b><i>'+esc(letsEn(q.w))+'</i></span><span class="ox">⭕ ❌</span></div>';
     }).join('')+'</div></section>';
  // 2쪽: 바구니
  h+='<section class="page">'+head(seed,'어느 가족일까요?')+
     '<h2><span class="no">2</span>바구니에 넣기 · Sort</h2>'+
     '<p class="how">낱말은 어느 가족일까요? 알맞은 친구에 동그라미 하세요. <span class="en">Circle the right family.</span></p>'+
     '<table class="sort">'+sort.map(function(q,i){
       return '<tr><td class="k">'+CIRCLE[i]+'</td><td class="w"><span>'+q.w[0]+'</span><b>'+esc(q.w[1])+'</b><i>'+esc(q.w[2])+'</i></td>'+
         ORDER.map(function(p){ return '<td class="ch t-'+p+'">'+P[p].em+' '+P[p].kid+'</td>'; }).join('')+'</tr>';
     }).join('')+'</table></section>';
  // 3쪽: 문장 탐정
  h+='<section class="page">'+head(seed,'문장 탐정')+
     '<h2><span class="no">3</span>문장 탐정 · Find</h2>'+
     '<p class="how">찾으라는 가족 낱말을 <b>모두</b> 찾아 동그라미 하세요. 한국어 문장과 영어 문장 <b>둘 다</b> 찾아요!<br>'+
     '💡 한국어 움직임 말은 문장 <b>맨 끝</b>, 영어 움직임 말은 이름 말 <b>바로 뒤</b>에 있어요.</p>'+
     find.map(function(f,i){
       const x=P[f.tg];
       return '<div class="sb"><div class="q"><span class="k">'+CIRCLE[i]+'</span>'+f.s.em+' <span class="pill c-'+f.tg+' t-'+f.tg+'">'+x.em+' '+x.kid+' · '+x.en+'</span> 을(를) 찾아요</div>'+
         '<div class="line"><span class="flag">🇰🇷</span>'+wordCells(parse(f.s.ko),false)+'</div>'+
         '<div class="line"><span class="flag">🇺🇸</span>'+wordCells(parse(f.s.en),false)+'</div></div>';
     }).join('')+'</section>';
  // 4쪽: 색칠하기
  h+='<section class="page">'+head(seed,'색칠하기')+legend()+
     '<h2><span class="no">4</span>가족 색칠하기 · Color</h2>'+
     '<p class="how">낱말 아래 네모를 가족 색깔로 칠하세요. <b class="t-n">이름 말 파랑</b> · <b class="t-v">움직임 말 빨강</b> · <b class="t-a">어떤지 말 노랑</b> · <b class="t-d">어떻게 말 초록</b><br>'+
     '빗금 칸은 도우미 말(the, a, my)이라 안 칠해도 돼요. 같은 색끼리 짝이 맞는지 봐요!</p>'+
     color.map(function(s,i){
       return '<div class="sb"><div class="q"><span class="k">'+CIRCLE[i]+'</span>'+s.em+'</div>'+
         '<div class="line"><span class="flag">🇰🇷</span>'+wordCells(parse(s.ko),true)+'</div>'+
         '<div class="line"><span class="flag">🇺🇸</span>'+wordCells(parse(s.en),true)+'</div></div>';
     }).join('')+'</section>';
  // 5쪽: 정답
  if(document.getElementById('with-ans').checked){
    const kid=function(p){ return P[p].kid; };
    h+='<section class="page ans-page">'+head(seed,'정답 (보호자용)')+'<div class="ans">'+
       '<div><h3>1. 같이 하자!</h3>'+lets.map(function(q,i){
         return CIRCLE[i]+' '+(q.p==='v'?'⭕':'❌')+' '+esc(q.w[1])+' – '+kid(q.p);
       }).join('<br>')+'</div>'+
       '<div><h3>2. 바구니에 넣기</h3>'+sort.map(function(q,i){
         return CIRCLE[i]+' '+esc(q.w[1])+' · '+esc(q.w[2])+' → <span class="t-'+q.p+'">'+kid(q.p)+'</span>';
       }).join('<br>')+'</div>'+
       '<div><h3>3. 문장 탐정</h3>'+find.map(function(f,i){
         const pick=function(s){ return parse(s).filter(function(t){return t.p===f.tg;}).map(function(t){return t.w;}).join(', '); };
         return CIRCLE[i]+' <span class="t-'+f.tg+'">'+kid(f.tg)+'</span>: '+esc(pick(f.s.ko))+' / '+esc(pick(f.s.en));
       }).join('<br>')+'</div>'+
       '<div><h3>4. 가족 색칠하기</h3>'+color.map(function(s,i){
         const one=function(str){ return parse(str).map(function(t){ return t.p==='x' ? '<span style="color:#aaa">'+esc(t.w)+'</span>' : '<span class="t-'+t.p+'">'+esc(t.w)+'</span>'; }).join(' '); };
         return CIRCLE[i]+' '+one(s.ko)+'<br>&nbsp;&nbsp;&nbsp;'+one(s.en);
       }).join('<br>')+
       '<p style="font-size:13px;color:var(--muted)">파랑=이름 말 · 빨강=움직임 말 · 노랑=어떤지 말 · 초록=어떻게 말 · 회색=도우미 말</p></div>'+
       '</div></section>';
  }
  document.getElementById('pages').innerHTML=h;
  document.querySelectorAll('.page').forEach(function(pg,i,all){
    pg.insertAdjacentHTML('beforeend','<div class="foot">품사 놀이터 문제지 '+seed+'번 · '+(i+1)+'/'+all.length+'</div>');
  });
}

const params=new URLSearchParams(location.search);
let seed=+params.get('no') || (1+Math.floor(Math.random()*9999));
function go(){ history.replaceState(null,'','?no='+seed); build(seed); }
document.getElementById('new').onclick=function(){ seed=1+Math.floor(Math.random()*9999); go(); };
document.getElementById('with-ans').onchange=function(){ build(seed); };
go();
</script>
</body>
</html>
